<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קיר חדשות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e9ee; --bezel:#ffffff; --ink:#1c2533; --muted:#5b6678;
  --line:#c9cfd9; --tally:#d4282f; --screen:#0d1420; --btn:#eef1f5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a24;--bezel:#1f2735;--ink:#e7ebf1;--muted:#93a0b4;
    --line:#2f3a4c;--tally:#ff4b52;--screen:#05080d;--btn:#29334450;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
h1{font-size:1.15rem;font-weight:700;margin:0;flex:1}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
button,select{font:inherit;font-size:.85rem;color:var(--ink);background:var(--btn);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--tally);outline-offset:2px}
main{flex:1;display:grid;gap:8px;padding:0 8px 8px;min-height:0;
  grid-template-columns:repeat(var(--cols,3),1fr);grid-auto-rows:1fr}
@media (max-width:760px){main{grid-template-columns:1fr;grid-auto-rows:minmax(240px,auto)}}
.tile{background:var(--bezel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tile.live .dot{background:var(--tally);box-shadow:0 0 0 3px color-mix(in srgb,var(--tally) 25%,transparent)}
.bar{display:flex;align-items:center;gap:8px;padding:5px 8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.name{font-weight:500;font-size:.95rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{padding:3px 8px;font-size:.78rem}
.screen{flex:1;background:var(--screen);position:relative;min-height:0}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
body.focus main{grid-template-columns:1fr;grid-auto-rows:1fr}
body.focus .tile:not(.big){display:none}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bezel);color:var(--ink);max-width:min(440px,92vw)}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
dialog input{width:100%;font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);direction:ltr}
dialog input#fName{direction:rtl}
dialog p{font-size:.8rem;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
footer{font-size:.75rem;color:var(--muted);padding:0 14px 8px}
</style>
</head>
<body>
<header>
  <h1>קיר חדשות</h1>
  <div class="ctrl">
    <select id="cols" aria-label="מספר עמודות">
      <option value="2">2 עמודות</option><option value="3" selected>3 עמודות</option><option value="4">4 עמודות</option>
    </select>
    <button id="add">הוספת ערוץ</button>
    <button id="reset">איפוס לברירת מחדל</button>
  </div>
</header>
<main id="wall"></main>
<footer>אם משבצת נשארת ריקה או מציגה שגיאה, האתר של הערוץ חוסם הטמעה. השתמשו ב"פתח בחלון", או החליפו את המקור לשידור ביוטיוב.</footer>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <strong id="dlgTitle">עריכת ערוץ</strong>
    <label for="fName">שם</label>
    <input id="fName" required>
    <label for="fSrc">מקור</label>
    <input id="fSrc" required placeholder="https://… או UC…">
    <p>אפשר להדביק: כתובת של דף שידור חי, קישור לסרטון/שידור ביוטיוב, או מזהה ערוץ יוטיוב שמתחיל ב-UC (מציג את השידור החי של הערוץ).</p>
    <div class="row">
      <button value="save" id="save">שמירה</button>
      <button value="cancel" formnovalidate>ביטול</button>
      <button value="delete" id="del" formnovalidate>מחיקה</button>
    </div>
  </form>
</dialog>

<script>
const DEFAULTS = [
  {name:"כאן 11", src:"https://www.kan.org.il/live/"},
  {name:"N12", src:"https://www.mako.co.il/mako-vod-live-tv/VOD-6540b8dcb64fd31006.htm"},
  {name:"ערוץ 13", src:"https://13tv.co.il/live/"},
  {name:"ערוץ 14", src:"https://www.c14.co.il/live"},
  {name:"i24NEWS עברית", src:"UCisowXt5wZkp2sR3rFh9lnQ"},
  {name:"ערוץ הכנסת", src:"https://www.knesset.tv/live/"}
];
const KEY = "newswall.v1";
let channels = load();
let audio = -1;   // index of the unmuted YouTube tile
let focused = -1;

function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(v)&&v.length) return v; }catch(e){}
  return DEFAULTS.map(c=>({...c}));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(channels)); }catch(e){} }

// Turn whatever the user pasted into {embed, open, yt}
function resolve(src){
  src = src.trim();
  let m;
  if(/^UC[\w-]{22}$/.test(src)) return yt("live_stream?channel="+src, "https://www.youtube.com/channel/"+src+"/live");
  try{
    const u = new URL(src);
    const h = u.hostname.replace(/^www\.|^m\./,"");
    if(h==="youtu.be") return yt(u.pathname.slice(1), src);
    if(h==="youtube.com"){
      if(u.searchParams.get("v")) return yt(u.searchParams.get("v"), src);
      if((m=u.pathname.match(/^\/(?:live|embed)\/([\w-]{11})/))) return yt(m[1], src);
      if((m=u.pathname.match(/^\/channel\/(UC[\w-]{22})/))) return yt("live_stream?channel="+m[1], src);
    }
  }catch(e){}
  return {embed:src, open:src, yt:false};
}
function yt(path, open){ return {embed:"https://www.youtube.com/embed/"+path, open, yt:true}; }
function ytSrc(base, muted){
  const sep = base.includes("?") ? "&" : "?";
  return base + sep + "autoplay=1&mute=" + (muted?1:0) + "&playsinline=1";
}

function render(){
  const wall = document.getElementById("wall");
  wall.innerHTML = "";
  channels.forEach((c,i)=>{
    const r = resolve(c.src);
    const t = document.createElement("section");
    t.className = "tile" + (i===audio?" live":"") + (i===focused?" big":"");
    t.innerHTML = `
      <div class="bar">
        <span class="dot" title="${i===audio?"השמע פעיל":""}"></span>
        <span class="name"></span>
        ${r.yt?`<button data-a="audio">${i===audio?"השתקה":"שמע"}</button>`:""}
        <button data-a="focus">${i===focused?"חזרה לקיר":"הגדלה"}</button>
        <button data-a="open">פתח בחלון</button>
        <button data-a="edit">עריכה</button>
      </div>
      <div class="screen"><iframe loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
    t.querySelector(".name").textContent = c.name;
    t.querySelector("iframe").title = c.name;
    t.querySelector("iframe").src = r.yt ? ytSrc(r.embed, i!==audio) : r.embed;
    t.querySelector(".bar").addEventListener("click", e=>{
      const a = e.target.dataset.a; if(!a) return;
      if(a==="audio"){ audio = (audio===i?-1:i); render(); }
      if(a==="focus"){ focused = (focused===i?-1:i); document.body.classList.toggle("focus", focused>=0); render(); }
      if(a==="open") window.open(r.open, "_blank", "noopener");
      if(a==="edit") edit(i);
    });
    wall.appendChild(t);
  });
}

const dlg = document.getElementById("dlg");
let editing = -1;
function edit(i){
  editing = i;
  document.getElementById("dlgTitle").textContent = i<0 ? "הוספת ערוץ" : "עריכת ערוץ";
  document.getElementById("fName").value = i<0 ? "" : channels[i].name;
  document.getElementById("fSrc").value = i<0 ? "" : channels[i].src;
  document.getElementById("del").hidden = i<0;
  dlg.showModal();
}
dlg.addEventListener("close", ()=>{
  const v = dlg.returnValue;
  if(v==="save"){
    const c = {name:document.getElementById("fName").value.trim(), src:document.getElementById("fSrc").value.trim()};
    if(c.name && c.src){ editing<0 ? channels.push(c) : (channels[editing]=c); }
  }
  if(v==="delete" && editing>=0){
    channels.splice(editing,1);
    if(audio===editing) audio=-1; else if(audio>editing) audio--;
    focused=-1; document.body.classList.remove("focus");
  }
  if(v==="save"||v==="delete"){ save(); render(); }
});

const colSel = document.getElementById("cols");
try{ const c = localStorage.getItem(KEY+".cols"); if(c) colSel.value = c; }catch(e){}
function applyCols(){ document.documentElement.style.setProperty("--cols", colSel.value); }
colSel.addEventListener("change", ()=>{ applyCols(); try{ localStorage.setItem(KEY+".cols", colSel.value); }catch(e){} });
document.getElementById("add").onclick = ()=>edit(-1);
document.getElementById("reset").onclick = ()=>{
  if(!confirm("לאפס את רשימת הערוצים לברירת המחדל?")) return;
  channels = DEFAULTS.map(c=>({...c})); audio=-1; focused=-1;
  document.body.classList.remove("focus"); save(); render();
};
applyCols();
render();
</script>
</body>
</html>
